source = ~/.config/hypr/itisaconfigbro/hyprlock/colors.conf

background {
    monitor =
    path = ~/.config/Wallpapers/cave-sunset-view.png
    color = $backgroundund
    blur_passes = 2
}

# Clock Display
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = $foreground
    font_size = 75
    font_family = JetBrainsMono Nerd Font
    position = 0, 150
    halign = center
    valign = center
}

# Password Input Box
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.2
    outer_color = $primary
    inner_color = $surface_container
    font_color = $foreground
    fade_on_empty = false
    placeholder_text = <span foreground="##cdd6f4">Password...</span>
    position = 0, -20
    halign = center
    valign = center
}h
